name: Build Marvelot APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unzip Marvelot project
        run: |
          mkdir marvelot_project
          unzip -q Marvelot_Final_v3_MobileBuild.zip -d marvelot_project

      - name: Build Customer APK
        working-directory: marvelot_project/android_customer_v3
        run: gradle assembleDebug

      - name: Build Admin APK
        working-directory: marvelot_project/admin_android
        run: gradle assembleDebug

      - name: Prepare APK files
        run: |
          cp marvelot_project/android_customer_v3/app/build/outputs/apk/debug/app-debug.apk Marvelot-Customer.apk
          cp marvelot_project/admin_android/app/build/outputs/apk/debug/app-debug.apk Marvelot-Admin.apk

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: Marvelot-APKs
          path: |
            Marvelot-Customer.apk
            Marvelot-Admin.apk
